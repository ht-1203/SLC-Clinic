<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2BBDCE" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SLC Clinic" />
  <link rel="manifest" href="manifest.json" />
  <title>SLC Clinics — ระบบจองหัตถการ & คอร์ส</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Kanit:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ====== DESKTOP NOTICE (hidden on mobile) ====== -->
  <div id="desktop-notice" class="desktop-notice">
    <div class="dn-left">
      <img src="slc-logo.png" class="dn-logo-img" alt="SLC Clinics & Hospital" />
      <h2 class="dn-tagline">ระบบจองหัตถการ<br>&amp; ติดตามคอร์สความงาม</h2>
      <ul class="dn-features">
        <li>ดูคอร์สที่ซื้อไว้และสิทธิ์คงเหลือ</li>
        <li>จองนัดหมายหัตถการออนไลน์</li>
        <li>เช็คอินด้วย QR Code</li>
      </ul>
    </div>
    <div class="dn-right">
      <div class="dn-phone-frame">
        <div id="dn-qr" class="dn-qr"></div>
      </div>
      <p class="dn-scan-label">สแกนเพื่อเปิดบนมือถือ</p>
      <p class="dn-url">ht-1203.github.io/SLC-Clinic</p>
    </div>
  </div>

  <!-- ====== MOBILE APP ====== -->
  <div id="app" class="app-shell" style="display:none">

    <!-- Loading screen -->
    <div id="loading" class="loading-screen">
      <div class="ls-content">
        <img src="slc-logo.png" width="120" height="120" alt="SLC" class="logo-img" />
        <p class="ls-brand">SLC Clinics &amp; Hospital</p>
        <div class="ls-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- App content -->
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar"></nav>

  </div>

  <!-- Toast (global) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Detect desktop vs mobile
    var isMobile = window.innerWidth < 768;
    var dn = document.getElementById('desktop-notice');
    var app = document.getElementById('app');

    if (isMobile) {
      dn.style.display = 'none';
      app.style.display = '';
    }

    // Desktop: show QR code + option to continue
    document.getElementById('dnContinue').onclick = function() {
      dn.style.display = 'none';
      app.style.display = '';
    };

    // Load QRCode for desktop notice
    (function(){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
      s.onload = function() {
        var el = document.getElementById('dn-qr');
        if (!el || !window.QRCode) return;
        QRCode.toDataURL('https://ht-1203.github.io/SLC-Clinic/', {
          width: 200, margin: 2,
          color: { dark: '#0D2030', light: '#ffffff' }
        }, function(err, url) {
          if (!err) {
            var img = document.createElement('img');
            img.src = url; img.width = 200; img.height = 200;
            img.style.display = 'block'; img.style.borderRadius = '8px';
            el.appendChild(img);
          }
        });
      };
      document.head.appendChild(s);
    })();

    // Load Supabase async
    (function(){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.onload = function(){
        var s2 = document.createElement('script');
        s2.src = 'supabase.js';
        s2.onload = function(){ window._supaReady = true; };
        document.head.appendChild(s2);
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
