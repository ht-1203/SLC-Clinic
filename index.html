<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2BBDCE" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SLC Clinic" />
  <link rel="manifest" href="manifest.json" />
  <title>SLC Clinics — ระบบจองหัตถการ & คอร์ส</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Kanit:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <svg viewBox="0 0 20 13" width="52" height="34"><path d="M10 9C8 4 2 2 1 6C0 10 5 11 10 9Z" fill="#2BBDCE"/><path d="M10 9C12 4 18 2 19 6C20 10 15 11 10 9Z" fill="#2BBDCE"/><ellipse cx="10" cy="10" rx="1.2" ry="1.8" fill="#2BBDCE"/></svg>
    <p>กำลังโหลด...</p>
  </div>

  <!-- App shell -->
  <div class="app-shell">
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    (function(){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.onload = function(){
        var s2 = document.createElement('script');
        s2.src = 'supabase.js';
        s2.onload = function(){ window._supaReady = true; };
        document.head.appendChild(s2);
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
