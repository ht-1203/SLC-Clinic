<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2BBDCE" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SLC Clinic" />
  <link rel="manifest" href="manifest.json" />
  <title>SLC Clinics — ระบบจองหัตถการ & คอร์ส</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Kanit:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ====== DESKTOP NOTICE (hidden on mobile) ====== -->
  <div id="desktop-notice" class="desktop-notice">
    <div class="dn-card">
      <!-- Logo -->
      <img src="slc-logo.png" style="width:200px;height:auto;display:block;" alt="SLC Clinics & Hospital" />

      <p class="dn-brand">SLC Clinics &amp; Hospital</p>

      <!-- Phone icon -->
      <div class="dn-phone-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2BBDCE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="32" height="32">
          <rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 5.5h6"/>
        </svg>
      </div>

      <h2 class="dn-title">แอปนี้ออกแบบสำหรับมือถือ</h2>
      <p class="dn-desc">กรุณาเปิดบนสมาร์ทโฟน หรือสแกน QR code ด้านล่าง</p>

      <!-- QR Code -->
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https%3A%2F%2Fht-1203.github.io%2FSLC-Clinic%2F&color=0D2030&bgcolor=ffffff&margin=1"
        width="160" height="160" alt="QR Code" style="display:block;border-radius:10px;border:1px solid #eee;" />

      <p class="dn-url">ht-1203.github.io/SLC-Clinic</p>
    </div>
  </div>

  <!-- ====== MOBILE APP ====== -->
  <div id="app" class="app-shell" style="display:none">

    <!-- Loading screen -->
    <div id="loading" class="loading-screen">
      <div class="ls-content">
        <img src="slc-logo.png" width="120" height="120" alt="SLC" class="logo-img" />
        <p class="ls-brand">SLC Clinics &amp; Hospital</p>
        <div class="ls-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- App content -->
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar"></nav>

  </div>

  <!-- Toast (global) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Detect desktop vs mobile
    var isMobile = window.innerWidth < 768;
    var dn = document.getElementById('desktop-notice');
    var app = document.getElementById('app');

    if (isMobile) {
      dn.style.display = 'none';
      app.style.display = '';
    }

    // Desktop: show QR code + option to continue
    document.getElementById('dnContinue').onclick = function() {
      dn.style.display = 'none';
      app.style.display = '';
    };

    // QR code now uses static API URL — no JS needed

    // Load Supabase async
    (function(){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.onload = function(){
        var s2 = document.createElement('script');
        s2.src = 'supabase.js';
        s2.onload = function(){ window._supaReady = true; };
        document.head.appendChild(s2);
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
