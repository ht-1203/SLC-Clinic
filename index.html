<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2BBDCE" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SLC Clinic" />
  <link rel="manifest" href="manifest.json" />
  <title>SLC Clinics — ระบบจองหัตถการ & คอร์ส</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Kanit:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Splash -->
  <div id="splash" class="splash" style="display:none">
    <div class="splash-ring splash-ring--1"></div>
    <div class="splash-ring splash-ring--2"></div>
    <div class="splash-content">
      <img src="slc-logo.png" class="splash-logo" alt="SLC" />
      <p class="splash-brand">SLC Clinics &amp; Hospital</p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app-shell">
    <div id="loading" class="loading-screen">
      <div class="ls-content">
        <img src="slc-logo.png" width="110" height="110" alt="SLC" class="logo-img" />
        <p class="ls-brand">SLC Clinics &amp; Hospital</p>
        <div class="ls-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    (function(){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.onload = function(){
        var s2 = document.createElement('script');
        s2.src = 'supabase.js';
        s2.onload = function(){ window._supaReady = true; };
        document.head.appendChild(s2);
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
